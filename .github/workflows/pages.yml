# Publishes the LowRider 4 Sandbox page to GitHub Pages (jeyeager65.github.io/lr4-sandbox). Manual only: it needs
# Pages turned on in the repo settings (Source: GitHub Actions).
# The site is web/ as committed: index.html, js/, data/ (the share data: no V1E geometry - visitors load their own
# part files), fluidnc/ + fluidtouch/ (the firmware builds, with their licenses), models/ (the pendant meshes) and
# coi-serviceworker.js (cross-origin isolation for FluidNC's threads; Pages can't send the headers). viewer.html is
# left out: it's the FreeCAD model's viewer and needs local exports.
name: Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site's files are there
        run: |
          for f in web/data/lr4_config.json web/fluidnc/program.wasm web/fluidtouch/fluidtouch.wasm web/coi-serviceworker.js; do
            test -f "$f" || { echo "$f is missing"; exit 1; }
          done
          python tools/check_no_parts.py --all

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -f _site/viewer.html
          # cache busting: Pages serves everything with max-age=600; ?v=<commit> on the page's files and loads
          python tools/stamp_build.py _site/index.html "${GITHUB_SHA::7}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
